[package]
name = "luckywin"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
serde = {version = "1.0", features=["derive"]}
serde_json = "1.0"
serde_valid = "1.0.5"
uuid = {version="1.18", features=["v4"]}
tokio = {version="1.46", features=["full"]}
tracing = "0.1.41"
tracing-subscriber = "0.3"
sea-orm = {version="1.1", features=["sqlx-postgres", "runtime-tokio-rustls", "macros"]}
chrono = {version="0.4", features=["serde"]}
utoipa = {version="5.4", features=["uuid", "chrono"]}
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }
tower-http = { version = "0.6", features = ["normalize-path", "cors"] }
async-trait = "0.1"
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"
