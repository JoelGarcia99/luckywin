<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luckywin Ticket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        @page {
            size: 80mm 170mm;
            margin: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #fff;
        }

        .ticket {
            width: 95%;
            height: 95%;
            margin: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            letter-spacing: 2px;
        }

        .game-name {
            font-size: 10px;
            color: #666;
        }

        .numbers-section {
            flex-grow: 1;
        }

        .numbers-title {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .number-sets {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .number-set {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 6px;
        }

        .digit {
            font-size: 20px;
            font-weight: 700;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #666;
            border-top: 1px solid #ccc;
            padding-top: 5px;
        }

        .footer {
            text-align: center;
            font-size: 7px;
            color: #666;
            margin-top: auto;
            padding-top: 5px;
        }
    </style>
</head>
<body>
    <div class="ticket">
        <div class="header">
            <div class="brand">LUCKYWIN</div>
            <div class="game-name">{{GAME_NAME}}</div>
        </div>

        <div class="numbers-section">
            <div class="numbers-title">Tus Números</div>
            <div class="number-sets">
                {{NUMBER_SETS}}
            </div>
        </div>

        <div class="info-section">
            <div class="client-info">
                <div><strong>Cliente:</strong> {{CLIENT_NAME}}</div>
                <div><strong>Móvil:</strong> {{CLIENT_CELLPHONE}}</div>
            </div>
            <div class="purchase-info">
                <div><strong>Serial:</strong> {{PURCHASE_SERIAL}}</div>
            </div>
        </div>

        <div class="footer">
            <div>Fecha de Compra: {{PURCHASE_DATE}}</div>
            <div>Cierre de Juego: {{GAME_CLOSES_AT}}</div>
            <div>Powered by Devall S.A.S</div>
        </div>
    </div>
</body>
</html>
