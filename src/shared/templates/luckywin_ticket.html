<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luckywin Ticket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        @page {
            size: 80mm 170mm;
            margin: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle, #1a202c 0%, #0f172a 100%);
        }

        .ticket {
            width: 95%;
            height: 95%;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f97316 0%, #facc15 50%, #f97316 100%);
            border-radius: 15px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            color: #fff;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-name {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .numbers-section {
            flex-grow: 1;
        }

        .numbers-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .number-sets {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .number-set {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
        }

        .digit {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 10px;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: auto;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="ticket">
        <div class="header">
            <div class="brand">LUCKYWIN</div>
            <div class="game-name">{{GAME_NAME}}</div>
        </div>

        <div class="numbers-section">
            <div class="numbers-title">Tus Números</div>
            <div class="number-sets">
                {{NUMBER_SETS}}
            </div>
        </div>

        <div class="info-section">
            <div class="client-info">
                <div><strong>Cliente:</strong> {{CLIENT_NAME}}</div>
                <div><strong>Móvil:</strong> {{CLIENT_CELLPHONE}}</div>
            </div>
            <div class="purchase-info">
                <div><strong>Serial:</strong> {{PURCHASE_SERIAL}}</div>
            </div>
        </div>

        <div class="footer">
            <div>Fecha de Compra: {{PURCHASE_DATE}}</div>
            <div>Cierre de Juego: {{GAME_CLOSES_AT}}</div>
            <div>Powered by Devall S.A.S</div>
        </div>
    </div>
</body>
</html>
