<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luckywin Ticket</title>
    <style>
        @page {
            size: 80mm 170mm;
            margin: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('assets/inter/Inter-400.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('assets/inter/Inter-500.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('assets/inter/Inter-600.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('assets/inter/Inter-700.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 800;
            font-display: swap;
            src: url('assets/inter/Inter-800.ttf') format('truetype');
        }

        .ticket {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            box-sizing: border-box;
            position: relative;
        }

        /* Decorative top accent */
        .ticket::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
        }

        .header {
            text-align: center;
            padding: 25px 20px 20px;
            background: linear-gradient(135deg, #f0f9ff 0%, #faf5ff 100%);
            border-bottom: 2px solid #e0e7ff;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .game-name {
            font-size: 11px;
            font-weight: 600;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .numbers-section {
            flex-grow: 1;
            padding: 25px 20px;
            background: #ffffff;
        }

        .numbers-title {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .number-sets {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .number-set {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: transparent;
            border: none;
            border-radius: 12px;
            padding: 4px 8px;
        }

        .digit {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25),
                        0 2px 4px rgba(139, 92, 246, 0.2);
            line-height: 1;
        }

        .info-section {
            background: #f8fafc;
            padding: 18px 20px;
            border-top: 2px solid #e2e8f0;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .info-content {
            flex: 1 1 70%;
        }

        .signature-container {
            flex: 0 1 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .client-info, .purchase-info {
            margin-bottom: 0;
        }

        .client-info div, .purchase-info div {
            font-size: 11px;
            color: #475569;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .client-info strong, .purchase-info strong {
            font-weight: 700;
            color: #1e293b;
            font-size: 11px;
        }

        .paid-signature {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 4px;
        }

        .paid-signature svg {
            width: 100%;
            height: auto;
            max-width: 80px;
            max-height: 80px;
            filter: drop-shadow(0 2px 4px rgba(184, 134, 11, 0.3));
            transform: rotate(-12deg);
        }

        .footer {
            text-align: center;
            padding: 12px 20px 15px;
            background: #ffffff;
        }

        .footer div {
            font-size: 8px;
            color: #64748b;
            margin-bottom: 1px;
            line-height: 1.3;
        }

        .footer div:last-child {
            margin-top: 4px;
            font-weight: 600;
            color: #94a3b8;
            font-size: 7px;
            letter-spacing: 0.3px;
        }

        /* Visual separator dots */
        .separator-dots {
            text-align: center;
            padding: 12px 0;
            color: #cbd5e1;
            font-size: 14px;
            letter-spacing: 4px;
        }

        /* Watermark for non-production environments */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 72px;
            font-weight: 900;
            color: rgba(239, 68, 68, 0.15);
            text-transform: uppercase;
            letter-spacing: 8px;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            user-select: none;
        }
    </style>
</head>
<body>
    {{WATERMARK}}
    <div class="ticket">
        <div class="header">
            <div class="brand">LUCKYWIN</div>
            <div class="game-name">{{GAME_NAME}}</div>
        </div>

        <div class="numbers-section">
            <div class="numbers-title">Tus Números</div>
            <div class="number-sets">
                {{NUMBER_SETS}}
            </div>
        </div>

        <div class="info-section">
            <div class="info-content">
                <div class="client-info">
                    <div><strong>Cliente:</strong> {{CLIENT_NAME}}</div>
                    <div><strong>Móvil:</strong> {{CLIENT_CELLPHONE}}</div>
                </div>
                <div class="purchase-info">
                    <div><strong>Serial:</strong> {{PURCHASE_SERIAL}}</div>
                </div>
            </div>
            <div class="signature-container">
                {{PAID_SIGNATURE}}
            </div>
        </div>

        <div class="footer">
            <div>Fecha de Compra: {{PURCHASE_DATE}}</div>
            <div>Cierre de Juego: {{GAME_CLOSES_AT}}</div>
            <div>Powered by Devall S.A.S</div>
        </div>
    </div>
</body>
</html>
