<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luckywin Ticket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        @page {
            size: 80mm 170mm;
            margin: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
        }

        .ticket {
            width: 95%;
            height: 95%;
            margin: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
            border-radius: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            color: #2c5282;
            letter-spacing: 2px;
        }

        .game-name {
            font-size: 12px;
            color: #718096;
        }

        .numbers-section {
            flex-grow: 1;
        }

        .numbers-title {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2c5282;
        }

        .number-sets {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .number-set {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #e2e8f0;
        }

        .digit {
            font-size: 24px;
            font-weight: 700;
            color: #2d3748;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #718096;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }

        .footer {
            text-align: center;
            font-size: 8px;
            color: #a0aec0;
            margin-top: auto;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="ticket">
        <div class="header">
            <div class="brand">LUCKYWIN</div>
            <div class="game-name">{{GAME_NAME}}</div>
        </div>

        <div class="numbers-section">
            <div class="numbers-title">Tus Números</div>
            <div class="number-sets">
                {{NUMBER_SETS}}
            </div>
        </div>

        <div class="info-section">
            <div class="client-info">
                <div><strong>Cliente:</strong> {{CLIENT_NAME}}</div>
                <div><strong>Móvil:</strong> {{CLIENT_CELLPHONE}}</div>
            </div>
            <div class="purchase-info">
                <div><strong>Serial:</strong> {{PURCHASE_SERIAL}}</div>
            </div>
        </div>

        <div class="footer">
            <div>Fecha de Compra: {{PURCHASE_DATE}}</div>
            <div>Cierre de Juego: {{GAME_CLOSES_AT}}</div>
            <div>Powered by Devall S.A.S</div>
        </div>
    </div>
</body>
</html>
