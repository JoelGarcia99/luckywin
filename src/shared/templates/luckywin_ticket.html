<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luckywin Ticket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        @page {
            size: 80mm 150mm;
            margin: 0;
        }

        :root {
            --background-gradient-start: #1a202c;
            --background-gradient-end: #2d3748;
            --ticket-gradient-start: #0f172a;
            --ticket-gradient-end: #1e293b;
            --primary-gold: #facc15;
            --text-color: #f7fafc;
            --secondary-text-color: #a0aec0;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle, var(--background-gradient-end) 0%, var(--background-gradient-start) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ticket {
            width: 80mm;
            height: 150mm;
            background: linear-gradient(135deg, var(--ticket-gradient-end) 0%, var(--ticket-gradient-start) 100%);
            color: var(--text-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--primary-gold);
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--primary-gold);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-gold);
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary-gold);
        }

        .game-name {
            font-size: 14px;
            color: var(--secondary-text-color);
        }

        .numbers-section {
            flex-grow: 1;
        }

        .numbers-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary-gold);
        }

        .number-sets {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .number-set {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
        }

        .digit {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-gold);
            text-shadow: 0 0 5px var(--primary-gold);
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--secondary-text-color);
            border-top: 1px solid var(--primary-gold);
            padding-top: 10px;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: var(--secondary-text-color);
            margin-top: auto;
            padding-top: 10px;
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .ticket {
                box-shadow: none;
                border-radius: 0;
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="ticket">
        <div class="header">
            <div class="brand">LUCKYWIN</div>
            <div class="game-name">{{GAME_NAME}}</div>
        </div>

        <div class="numbers-section">
            <div class="numbers-title">Tus Números</div>
            <div class="number-sets">
                {{NUMBER_SETS}}
            </div>
        </div>

        <div class="info-section">
            <div class="client-info">
                <div><strong>Cliente:</strong> {{CLIENT_NAME}}</div>
                <div><strong>Móvil:</strong> {{CLIENT_CELLPHONE}}</div>
            </div>
            <div class="purchase-info">
                <div><strong>Serial:</strong> {{PURCHASE_SERIAL}}</div>
            </div>
        </div>

        <div class="footer">
            <div>Fecha de Compra: {{PURCHASE_DATE}}</div>
            <div>Cierre de Juego: {{GAME_CLOSES_AT}}</div>
            <div>Powered by Devall S.A.S</div>
        </div>
    </div>
</body>
</html>
